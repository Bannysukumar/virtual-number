; Asterisk Dialplan for Missed Call Callback System
; Add this to your extensions.conf or include it

; ============================================
; OUTBOUND CALLBACK CONTEXT
; ============================================
; This context handles outbound callbacks triggered by SMS
[outbound-callback]
; Extension 's' is used when originating from AMI/CLI
; Phone number is passed via channel variable CALLER_NUM
exten => s,1,NoOp(Outbound callback initiated)
exten => s,n,Set(CALL_START=${EPOCH})
exten => s,n,NoOp(CALLER_NUM=${CALLER_NUM}, CALLBACK_ID=${CALLBACK_ID})
exten => s,n,Set(CALLED_NUM=${CALLER_NUM})
exten => s,n,Set(CALL_DIRECTION=outgoing)
exten => s,n,Set(CALL_TYPE=missed_call)
exten => s,n,NoOp(Calling ${CALLER_NUM} from missed call)
exten => s,n,Progress()  ; Send early media immediately
exten => s,n,Dial(SIP/${CALLER_NUM}@trunk,30,Tt)  ; T = timeout, t = allow transfer
exten => s,n,Goto(callback-answered,${DIALSTATUS},1)

; Extension with phone number as argument (alternative method)
exten => _X.,1,NoOp(Outbound callback to ${EXTEN})
exten => _X.,n,Set(CALL_START=${EPOCH})
exten => _X.,n,Set(CALLER_NUM=${EXTEN})
exten => _X.,n,Set(CALLED_NUM=${EXTEN})
exten => _X.,n,Set(CALL_DIRECTION=outgoing)
exten => _X.,n,Set(CALL_TYPE=missed_call)
exten => _X.,n,Progress()
exten => _X.,n,Dial(SIP/${EXTEN}@trunk,30,Tt)
exten => _X.,n,Goto(callback-answered,${DIALSTATUS},1)

; Handle different dial statuses
exten => callback-answered,ANSWERED,1,NoOp(Callback answered successfully)
exten => callback-answered,ANSWERED,n,Set(ANSWER_TIME=${EPOCH})
exten => callback-answered,ANSWERED,n,Set(CALL_STATUS=answered)
exten => callback-answered,ANSWERED,n,Goto(internal,1002,1)  ; Route to IVR

exten => callback-answered,BUSY,1,NoOp(Callback - line busy)
exten => callback-answered,BUSY,n,Set(CALL_STATUS=busy)
exten => callback-answered,BUSY,n,Hangup()

exten => callback-answered,NOANSWER,1,NoOp(Callback - no answer)
exten => callback-answered,NOANSWER,n,Set(CALL_STATUS=no-answer)
exten => callback-answered,NOANSWER,n,Hangup()

exten => callback-answered,CHANUNAVAIL,1,NoOp(Callback - channel unavailable)
exten => callback-answered,CHANUNAVAIL,n,Set(CALL_STATUS=failed)
exten => callback-answered,CHANUNAVAIL,n,Hangup()

exten => callback-answered,CONGESTION,1,NoOp(Callback - congestion)
exten => callback-answered,CONGESTION,n,Set(CALL_STATUS=failed)
exten => callback-answered,CONGESTION,n,Hangup()

exten => callback-answered,default,1,NoOp(Callback ended with status: ${DIALSTATUS})
exten => callback-answered,default,n,Set(CALL_STATUS=failed)
exten => callback-answered,default,n,Hangup()

; Hangup handler for callback logging
exten => h,1,NoOp(Callback hangup - logging call)
exten => h,n,Set(END_TIME=${EPOCH})
exten => h,n,Set(DURATION=$[${END_TIME} - ${CALL_START}])
exten => h,n,Set(TALK_TIME=$[${END_TIME} - ${ANSWER_TIME}])
exten => h,n,Set(RECORDING_PATH=/var/recordings/calls/callback_${CALL_START}_${CALLER_NUM}.wav)
exten => h,n,System(/usr/local/bin/log-callback.sh "${CALLER_NUM}" "${CALLED_NUM}" "${CALL_START}" "${ANSWER_TIME}" "${END_TIME}" "${DURATION}" "${TALK_TIME}" "${RECORDING_PATH}" "${CALL_STATUS}" "${CALLBACK_ID}")

; ============================================
; FIXED IVR EXTENSION 1002 (Human Voice)
; ============================================
; This is the main IVR that callbacks connect to
; Fixed to log on ANSWER and prevent 11-second timeout
[internal]
exten => 1002,1,NoOp(Call to extension 1002 - IVR)
exten => 1002,n,Answer()
exten => 1002,n,Set(CALL_START=${EPOCH})
exten => 1002,n,Set(ANSWER_TIME=${EPOCH})  ; Set answer time immediately
exten => 1002,n,Set(CALLER_NUM=${CALLERID(num)})
exten => 1002,n,Set(CALLED_NUM=${EXTEN})
exten => 1002,n,Set(CALL_STATUS=answered)
exten => 1002,n,Set(EARLY_MEDIA_SENT=1)
exten => 1002,n,Progress()  ; Send early media immediately to prevent timeout
exten => 1002,n,Wait(0.5)    ; Small wait for RTP to establish
exten => 1002,n,Set(RECORDING_DIR=/var/recordings/calls)
exten => 1002,n,Set(RECORDING_FILE=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_${CALLERID(num)})
exten => 1002,n,MixMonitor(${RECORDING_DIR}/${RECORDING_FILE}.wav)  ; Start recording immediately
exten => 1002,n,NoOp(Recording started: ${RECORDING_FILE}.wav)
exten => 1002,n,Log(NOTICE,Call answered - logging immediately)
exten => 1002,n,System(/usr/local/bin/log-call-answered.sh "${CALLER_NUM}" "${CALLED_NUM}" "${CALL_START}" "${ANSWER_TIME}")
exten => 1002,n,Playback(en/custom/greeting)  ; Human voice greeting
exten => 1002,n,Wait(0.3)
exten => 1002,n,Playback(en/custom/menu-1)    ; Press 1 for music rags
exten => 1002,n,Wait(0.3)
exten => 1002,n,Playback(en/custom/menu-2)    ; Press 2 for Thala songs
exten => 1002,n,Wait(0.3)
exten => 1002,n,Playback(en/custom/menu-3)    ; Press 3 for drums
exten => 1002,n,Wait(0.3)
exten => 1002,n,Playback(en/custom/menu-4)    ; Press 4 to talk to assistant
exten => 1002,n,WaitExten(15)  ; Wait for DTMF input (15 seconds)
exten => 1002,n,Goto(1002-options,s,1)

; IVR Menu Options Handler
exten => 1002-options,1,NoOp(IVR Menu Options)
exten => 1,1,NoOp(Option 1 selected - Music Rags)
exten => 1,n,Set(IVR_OPTION=1)
exten => 1,n,Playback(en/custom/option-1)
exten => 1,n,System(/usr/local/bin/log-ivr-option.sh "${CALLER_NUM}" "1" "${EPOCH}")
exten => 1,n,Wait(2)
exten => 1,n,Playback(en/custom/menu-1)  ; Repeat menu
exten => 1,n,Goto(1002-options,s,1)

exten => 2,1,NoOp(Option 2 selected - Thala Songs)
exten => 2,n,Set(IVR_OPTION=2)
exten => 2,n,Playback(en/custom/option-2)
exten => 2,n,System(/usr/local/bin/log-ivr-option.sh "${CALLER_NUM}" "2" "${EPOCH}")
exten => 2,n,Wait(2)
exten => 2,n,Playback(en/custom/menu-2)  ; Repeat menu
exten => 2,n,Goto(1002-options,s,1)

exten => 3,1,NoOp(Option 3 selected - Drums)
exten => 3,n,Set(IVR_OPTION=3)
exten => 3,n,Playback(en/custom/option-3)
exten => 3,n,System(/usr/local/bin/log-ivr-option.sh "${CALLER_NUM}" "3" "${EPOCH}")
exten => 3,n,Wait(2)
exten => 3,n,Playback(en/custom/menu-3)  ; Repeat menu
exten => 3,n,Goto(1002-options,s,1)

exten => 4,1,NoOp(Option 4 selected - Talk to Assistant)
exten => 4,n,Set(IVR_OPTION=4)
exten => 4,n,Playback(en/custom/option-4)
exten => 4,n,System(/usr/local/bin/log-ivr-option.sh "${CALLER_NUM}" "4" "${EPOCH}")
exten => 4,n,Wait(2)
exten => 4,n,Playback(en/custom/menu-4)  ; Repeat menu
exten => 4,n,Goto(1002-options,s,1)

exten => t,1,NoOp(Timeout - no input received)
exten => t,n,Playback(en/custom/invalid)
exten => t,n,Wait(1)
exten => t,n,Playback(en/custom/menu-1)  ; Repeat full menu once
exten => t,n,WaitExten(10)  ; Give one more chance
exten => t,n,Goto(1002-hangup,1,1)

exten => i,1,NoOp(Invalid option pressed)
exten => i,n,Playback(en/custom/invalid)
exten => i,n,Wait(1)
exten => i,n,Goto(1002-options,s,1)

; Hangup handler for IVR calls
exten => 1002-hangup,1,NoOp(IVR call ending - final logging)
exten => 1002-hangup,n,Set(END_TIME=${EPOCH})
exten => 1002-hangup,n,Set(DURATION=$[${END_TIME} - ${CALL_START}])
exten => 1002-hangup,n,Set(TALK_TIME=$[${END_TIME} - ${ANSWER_TIME}])
exten => 1002-hangup,n,Set(RECORDING_PATH=${RECORDING_DIR}/${RECORDING_FILE}.wav)
exten => 1002-hangup,n,System(/usr/local/bin/log-call-complete.sh "${CALLER_NUM}" "${CALLED_NUM}" "${CALL_START}" "${ANSWER_TIME}" "${END_TIME}" "${DURATION}" "${TALK_TIME}" "${RECORDING_PATH}" "${IVR_OPTION}")
exten => 1002-hangup,n,Hangup()

; General hangup handler (fallback)
exten => h,1,NoOp(General hangup handler)
exten => h,n,Set(END_TIME=${EPOCH})
exten => h,n,Set(DURATION=$[${END_TIME} - ${CALL_START}])
exten => h,n,Set(TALK_TIME=$[${END_TIME} - ${ANSWER_TIME}])
exten => h,n,System(/usr/local/bin/log-call-complete.sh "${CALLER_NUM}" "${CALLED_NUM}" "${CALL_START}" "${ANSWER_TIME}" "${END_TIME}" "${DURATION}" "${TALK_TIME}" "" "")

