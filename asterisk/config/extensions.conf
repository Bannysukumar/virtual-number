[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no
priorityjumping=no

[globals]
; Global variables
; Set your domain here (if using domain-based SIP)
; SIP_DOMAIN=sip.yourdomain.com

; Default context - handles incoming calls
[default]
exten => _X.,1,NoOp(Incoming call to ${EXTEN} from ${CALLERID(all)})
exten => _X.,n,Set(CALLERID(name)=${CALLERID(name)})
exten => _X.,n,Set(CALLERID(num)=${CALLERID(num)})
exten => _X.,n,Goto(internal,${EXTEN},1)

; Internal context - main call handling
[internal]
; Extension 1001 - Basic Auto Answer Flow
exten => 1001,1,NoOp(Call to extension 1001)
exten => 1001,n,Answer()
exten => 1001,n,Wait(1)
exten => 1001,n,Playback(welcome)
exten => 1001,n,Playback(vm-goodbye)
exten => 1001,n,Hangup()

; Extension 1002 - IVR Flow
exten => 1002,1,NoOp(Call to extension 1002 - IVR)
exten => 1002,n,Answer()
exten => 1002,n,Wait(1)
exten => 1002,n,Background(main-menu)
exten => 1002,n,WaitExten(10)
exten => 1002,n,Goto(1002-options,s,1)

exten => 1002-options,1,NoOp(IVR Menu Options)
exten => 1,1,NoOp(Option 1 selected)
exten => 1,n,Playback(sales)
exten => 1,n,Goto(1002-options,s,1)
exten => 2,1,NoOp(Option 2 selected)
exten => 2,n,Playback(support)
exten => 2,n,Goto(1002-options,s,1)
exten => 3,1,NoOp(Option 3 selected)
exten => 3,n,Playback(information)
exten => 3,n,Goto(1002-options,s,1)
exten => t,1,NoOp(Timeout)
exten => t,n,Playback(vm-goodbye)
exten => t,n,Hangup()
exten => i,1,NoOp(Invalid option)
exten => i,n,Playback(invalid)
exten => i,n,Goto(1002-options,s,1)

; Extension 1003 - Voice Question Flow
exten => 1003,1,NoOp(Call to extension 1003 - Questions)
exten => 1003,n,Answer()
exten => 1003,n,Wait(1)
exten => 1003,n,Playback(welcome)
exten => 1003,n,Set(RECORDING_DIR=/var/recordings/questions)
exten => 1003,n,Set(RECORDING_FILE=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_q1)
exten => 1003,n,Playback(beep)
exten => 1003,n,Record(${RECORDING_DIR}/${RECORDING_FILE}.wav,0,60,q)
exten => 1003,n,NoOp(Recording saved: ${RECORDING_FILE}.wav)
exten => 1003,n,Set(RECORDING_FILE=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_q2)
exten => 1003,n,SayDigits(2)
exten => 1003,n,Playback(beep)
exten => 1003,n,Record(${RECORDING_DIR}/${RECORDING_FILE}.wav,0,60,q)
exten => 1003,n,NoOp(Recording saved: ${RECORDING_FILE}.wav)
exten => 1003,n,Playback(vm-thanks)
exten => 1003,n,Hangup()

; Extension 1004 - Missed Call + Callback Flow
exten => 1004,1,NoOp(Call to extension 1004 - Missed Call)
exten => 1004,n,Answer()
exten => 1004,n,Wait(1)
exten => 1004,n,Playback(vm-thanks)
exten => 1004,n,Hangup()
exten => h,1,NoOp(Call ended - logging missed call)
exten => h,n,System(/usr/local/bin/log-missed-call.sh ${CALLERID(num)} ${EXTEN})
exten => h,n,NoOp(Missed call logged)

; Extension 1005 - Full Call Recording
exten => 1005,1,NoOp(Call to extension 1005 - Full Recording)
exten => 1005,n,Answer()
exten => 1005,n,Wait(1)
exten => 1005,n,Set(RECORDING_DIR=/var/recordings/calls)
exten => 1005,n,Set(RECORDING_FILE=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_${CALLERID(num)})
exten => 1005,n,MixMonitor(${RECORDING_DIR}/${RECORDING_FILE}.wav)
exten => 1005,n,Playback(welcome)
exten => 1005,n,Dial(SIP/1001,30)
exten => 1005,n,Hangup()

; Voicemail context
[voicemail]
exten => _X.,1,VoicemailMain(${EXTEN}@default)
exten => _X.,n,Hangup()

; Outbound context (for future callback functionality)
[outbound]
exten => _X.,1,NoOp(Outbound call to ${EXTEN})
exten => _X.,n,Dial(SIP/${EXTEN}@trunk,30)
exten => _X.,n,Hangup()

