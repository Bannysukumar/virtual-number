[general]
; SIP General Configuration
context=default
allowguest=no
allowoverlap=no
bindport=5060
bindaddr=0.0.0.0
srvlookup=yes
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=opus
allow=g729
rtpstart=10000
rtpend=20000
rtpkeepalive=60
rtptimeout=60
rtpholdtimeout=300
t1min=100
timert1=500
timerb=32000
qualify=yes
qualifyfreq=60
registertimeout=20
registerattempts=10
maxforwards=70
useragent=Asterisk Virtual Phone System
alwaysauthreject=yes
match_auth_username=yes
; Security settings
allowexternaldomains=no
allowexternalinvites=no
allowexternalnotify=no
allowexternalregister=no
; Logging
sipdebug=no
recordhistory=yes
dumphistory=yes

; SIP User Template
[template-user](!)
type=friend
host=dynamic
canreinvite=no
context=internal
dtmfmode=rfc2833
disallow=all
allow=ulaw
allow=alaw
allow=gsm
nat=force_rport,comedia
directmedia=no
qualify=yes
qualifyfreq=60
trustrpid=yes
sendrpid=yes
callerid=Unknown
mailbox=1000@default

; Example SIP Users (Virtual Numbers)
; Format: [extension_number]
; Each user represents one virtual number

[1001](template-user)
secret=ChangeThisPassword123
callerid="Virtual Number 1" <1001>
mailbox=1001@default

[1002](template-user)
secret=ChangeThisPassword123
callerid="Virtual Number 2" <1002>
mailbox=1002@default

[1003](template-user)
secret=ChangeThisPassword123
callerid="Virtual Number 3" <1003>
mailbox=1003@default

; Add more SIP users as needed
; Copy the template and change the extension number

